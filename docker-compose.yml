services:
  php:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    environment:
      APP_ENV: local
      HOME: /var/www/html
      XDG_CONFIG_HOME: /var/www/html/.config
    working_dir: /var/www/html
    volumes:
      - ./backend-app:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/nginx/htpasswd:/etc/nginx/.htpasswd:ro
      - ./backend-app:/var/www/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_0900_ai_ci",
      "--default-time-zone=+00:00"
    ]
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  horizon:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./backend-app:/var/www/html
    command: php artisan horizon
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-app:/var/www/html
    command: sh -lc 'while :; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/node/Dockerfile
    user: "node"
    working_dir: /app
    volumes:
      - type: bind
        source: ./frontend-app
        target: /app
      - type: bind
        source: ./frontend-app/node_modules
        target: /app/node_modules
    command: sh -lc "npm ci || npm i && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  php-admin:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      HOME: /var/www/html
      XDG_CONFIG_HOME: /var/www/html/.config
    volumes:
      - ./backend-admin:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend-admin:
    build:
      context: .
      dockerfile: deploy/docker/node/Dockerfile
    user: "node"
    working_dir: /app
    volumes:
      - type: bind
        source: ./frontend-admin
        target: /app
      - type: bind
        source: ./frontend-admin/node_modules
        target: /app/node_modules
    command: sh -lc "npm ci || npm i && npm run dev -- --host"
    ports:
      - "5174:5173"
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped


  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./deploy/docker/minio:/scripts:ro
    entrypoint: [ "/bin/sh","-lc","/scripts/init.sh" ]
    restart: "no"

  clamav:
    image: clamav/clamav:stable
    environment:
      - TZ=Europe/Amsterdam
      - CLAMD_STARTUP_TIMEOUT=180
    ports:
      - "3310:3310"
    volumes:
      - ./deploy/clamav:/etc/clamav:ro
      - clamdb:/var/lib/clamav
    healthcheck:
      test: [ "CMD-SHELL", "clamdscan --version >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker-media:
    build:
      context: .
      dockerfile: deploy/docker/media-worker/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html

    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      APP_ENV: local
      QUEUE_CONNECTION: redis
      TMPDIR: /tmp
    volumes:
      - ./backend-app:/var/www/html

    tmpfs:
      - /tmp:size=2g,noexec,nosuid,nodev

    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    init: true
    stop_signal: SIGTERM
    stop_grace_period: 10m

    healthcheck:
      test: [ "CMD-SHELL","php -v >/dev/null 2>&1 && ffmpeg -version >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 10

    command: >
      sh -lc 'php -d memory_limit=1024M artisan queue:work redis
      --queue=media
      --timeout=7200
      --sleep=1
      --backoff=3
      --tries=2
      --max-time=0
      --max-jobs=0
      --verbose
      --no-interaction'

    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - ./backend-app:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
      php:
        condition: service_healthy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    healthcheck:
      test: [ "CMD-SHELL","wget -qO- http://localhost:8080/apps || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
  minio_data:
  clamdb:
