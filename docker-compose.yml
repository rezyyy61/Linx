services:
  php:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    environment:
      APP_ENV: local
    working_dir: /var/www/html
    volumes:
      - ./backend-app:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend-app:/var/www/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_0900_ai_ci",
      "--default-time-zone=+00:00"
    ]
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  queue:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-app:/var/www/html
    command: php artisan queue:work --tries=3 --verbose --no-interaction
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend-app:/var/www/html
    command: sh -lc 'while :; do php artisan schedule:run --verbose --no-interaction; sleep 60; done'
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/node/Dockerfile
    user: "node"
    working_dir: /app
    volumes:
      - type: bind
        source: ./frontend-app
        target: /app
      - type: bind
        source: ./frontend-app/node_modules
        target: /app/node_modules
    command: sh -lc "npm ci || npm i && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  php-admin:
    build:
      context: .
      dockerfile: deploy/docker/php/Dockerfile
    user: "${UID}:${GID}"
    working_dir: /var/www/html
    environment:
      APP_ENV: local
    volumes:
      - ./backend-admin:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend-admin:
    build:
      context: .
      dockerfile: deploy/docker/node/Dockerfile
    user: "node"
    working_dir: /app
    volumes:
      - type: bind
        source: ./frontend-admin
        target: /app
      - type: bind
        source: ./frontend-admin/node_modules
        target: /app/node_modules
    command: sh -lc "npm ci || npm i && npm run dev -- --host"
    ports:
      - "5174:5173"
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

volumes:
  dbdata:
