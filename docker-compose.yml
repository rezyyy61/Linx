version: "3.9"
services:
  php:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    volumes:
      - ./backend:/var/www/html

  nginx:
    image: nginx:alpine
    depends_on: [php]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:alpine
    ports: ["6379:6379"]

volumes:
  dbdata:
