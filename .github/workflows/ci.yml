name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-app:
    name: Backend (App)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend-app/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend-app
        env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: App env & key
        working-directory: backend-app
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=app"
            echo "DB_USERNAME=app"
            echo "DB_PASSWORD=app"
          } >> .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -proot --silent && break
            sleep 1
          done

      - name: Check Artisan
        working-directory: backend-app
        run: php artisan --version

      - name: Migrate
        working-directory: backend-app
        run: php artisan migrate --force

      - name: Pint (code style)
        working-directory: backend-app
        run: ./vendor/bin/pint --test

      - name: PHPStan
        working-directory: backend-app
        run: ./vendor/bin/phpstan analyse

      - name: PHPUnit (testing env)
        working-directory: backend-app
        run: php artisan test --env=testing

  backend-admin:
    name: Backend (Admin)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: admin_db
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, intl, zip
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend-admin/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend-admin
        env:
          COMPOSER_MEMORY_LIMIT: -1
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: App env & key
        working-directory: backend-admin
        run: |
          cp .env.example .env
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=admin_db"
            echo "DB_USERNAME=app"
            echo "DB_PASSWORD=app"
          } >> .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            mysqladmin ping -h 127.0.0.1 -proot --silent && break
            sleep 1
          done

      - name: Check Artisan
        working-directory: backend-admin
        run: php artisan --version

      - name: Migrate
        working-directory: backend-admin
        run: php artisan migrate --force

      - name: Pint (code style)
        working-directory: backend-admin
        run: ./vendor/bin/pint --test

      - name: PHPStan
        working-directory: backend-admin
        run: ./vendor/bin/phpstan analyse || true

      - name: PHPUnit (testing env)
        working-directory: backend-admin
        run: php artisan test --env=testing || true

  frontend-app:
    name: Frontend (App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install deps
        working-directory: frontend-app
        run: npm ci

      - name: Lint
        working-directory: frontend-app
        run: npm run lint

      - name: Type-check
        working-directory: frontend-app
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend-app
        run: npm run test:unit

      - name: Build
        working-directory: frontend-app
        run: npm run build

  frontend-admin:
    name: Frontend (Admin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install deps
        working-directory: frontend-admin
        run: npm ci

      - name: Lint
        working-directory: frontend-admin
        run: npm run lint

      - name: Type-check
        working-directory: frontend-admin
        run: npm run type-check

      - name: Unit tests
        working-directory: frontend-admin
        run: npm run test:unit

      - name: Build
        working-directory: frontend-admin
        run: npm run build
