TCPSocket 3310
TCPAddr 0.0.0.0

# لاگ بهتر
LogTime yes
LogVerbose yes

# محدودیت‌ها بزرگ و مناسب ویدیو/پی‌دی‌اف
StreamMaxLength 1024M
MaxScanSize     1024M
MaxFileSize     1024M
ReadTimeout     180

# ترد معقول (روی لپ‌تاپ می‌تونی 3–6 بگذاری)
MaxThreads 6

# مهم: باز کردن و اسکن انواع کانتینر/فرمت
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
ScanSWF yes
ScanELF yes
ScanXMLDOCS yes
ScanHWP3 yes
Bytecode yes
HeuristicScanPrecedence yes

# امنیت بیشتر: آرشیو/پی‌دی‌اف رمزدار را بلاک کن (اختیاری ولی مفید)
ArchiveBlockEncrypted yes

# عمق بازکردن لایه‌ها
MaxRecursion 16

# محدودیت‌های PCRE برای امضاهای پیچیده (اینا کمک می‌کنند گیر نده)
PCREMatchLimit 100000
PCRERecMatchLimit 200000

DatabaseDirectory /var/lib/clamav
