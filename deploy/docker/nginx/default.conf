server {
  listen 80 default_server;
  server_name localhost;

  root /var/www/html/public;
  index index.php index.html;

  client_max_body_size 25m;
  charset utf-8;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml text/javascript image/svg+xml;
  gzip_min_length 1024;

  location = /healthz { return 200 'ok'; }

  location ~* \.(?:css|js|mjs|map|json|woff2?|ttf|eot|gif|ico|png|jpg|jpeg|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 120s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
  }

  location ^~ /horizon {
    auth_basic "Horizon";
    auth_basic_user_file /etc/nginx/.htpasswd;

    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ /\. {
    deny all;
  }
}

# Frontend App (Vite dev) + API
server {
  listen 80;
  server_name app.localhost;

  root /var/www/html/public;
  index index.php index.html;

  # API -> Laravel
  location ^~ /api/ {
    try_files $uri /index.php?$query_string;
  }

  # Sanctum -> Laravel
    location ^~ /sanctum/ {
      try_files $uri /index.php?$query_string;
    }

  # PHP handler
  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 120s;
  }


  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location = /healthz { return 200 'ok'; }
}

